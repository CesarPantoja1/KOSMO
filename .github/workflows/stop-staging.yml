name: Stop Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STOP-STAGING to stop the shared instance after confirming its active revision."
        required: true
        type: string

# Staging is shared. Automatic shutdown from a closed PR can stop a newer
# revision, therefore shutdown is an explicit operator action.
concurrency:
  group: stop-staging
  cancel-in-progress: false

jobs:
  stop-staging:
    name: Stop Staging instance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Require explicit confirmation
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "STOP-STAGING"

      - name: Stop the Staging instance when it is running
        shell: bash
        run: |
          set -euo pipefail

          state="$(aws ec2 describe-instances \
            --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"

          case "$state" in
            running)
              aws ec2 stop-instances \
                --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" >/dev/null
              aws ec2 wait instance-stopped \
                --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}"
              echo "Staging instance stopped."
              ;;
            stopped)
              echo "Staging instance is already stopped."
              ;;
            *)
              echo "::error::Staging instance is in unsupported state: $state"
              exit 1
              ;;
          esac
