          type: string
        description: Nombre del esquema (ej. DiscoveryResponse)
    get:
      tags: [schemas]
      summary: Obtener JSON Schema de un DTO
      operationId: get_schema
      responses:
        "200":
          description: JSON Schema del DTO solicitado
          content:
            application/json:
              schema:
                type: object
