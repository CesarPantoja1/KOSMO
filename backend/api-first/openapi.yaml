openapi: 3.1.0
info:
  title: KOSMO API
  version: "0.1.0"
  description: >-
    API de KOSMO - plataforma low-code de spec-driven development asistida por IA.
    Ciclo completo: Descubrimiento -> Caracteristicas -> Requisitos -> Modelo -> Codigo.

    Convenciones:
    - Autenticacion PKCE (RFC 7636) con JWT RS256 (bearerAuth).
    - Errores RFC 7807 (application/problem+json) con type URN, trace_id y violations.
    - Fechas ISO-8601 UTC con sufijo Z.
    - Las fases siguen el orden Descubrimiento -> Caracteristicas -> Requisitos -> Modelo.
      La consistencia solo se evalua hacia la derecha (downstream).

    Los endpoints de generacion de codigo estan marcados con x-status: planned;
    el frontend puede integrarse contra ellos mientras el backend los implementa.
  contact:
    name: KOSMO Team
    email: dev@kosmo.app
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Desarrollo local
tags:
  - name: health
    description: Disponibilidad del servidor
  - name: auth
    description: Autenticacion PKCE (RFC 7636) con JWT RS256
  - name: projects
    description: Gestion de proyectos
  - name: discovery
    description: Fase de Descubrimiento - documento de vision de producto
  - name: features
    description: Fase de Caracteristicas
  - name: requirements
    description: Fase de Requisitos (EARS)
  - name: modelo
    description: Fase de Modelo - diagramas de actividad PlantUML
  - name: consistency
    description: Evaluacion de consistencia downstream entre fases
  - name: schemas
    description: Introspeccion de esquemas JSON para formularios dinamicos
  - name: implementation
    description: Generacion de codigo por Feature via OpenCode (planificada)
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Verificar disponibilidad del servidor
      operationId: health_check
      security: []
      responses:
        "200":
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  # ══════════════════════════════ AUTH ══════════════════════════════

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Crear cuenta de usuario
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "409":
          description: Email ya registrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/auth/authorize:
    post:
      tags: [auth]
      summary: Iniciar flujo PKCE y obtener codigo de autorizacion
      operationId: auth_authorize
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Codigo de autorizacion emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationCodeResponse"
        "401":
          description: Credenciales invalidas o cuenta bloqueada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/token:
    post:
      tags: [auth]
      summary: Intercambiar codigo de autorizacion por par de tokens JWT
      operationId: auth_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Par de tokens emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          description: Error OAuth (codigo invalido, PKCE mismatch, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar par de tokens con refresh token (Token Rotation)
      operationId: auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Nuevo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Refresh token invalido, expirado o reutilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Obtener identidad del usuario autenticado
      operationId: auth_me
      responses:
        "200":
          description: Identidad del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalView"
        "401":
          description: Token ausente, invalido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesion activa (revocar tokens)
      operationId: auth_logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Sesion cerrada
        "401":
          description: Token invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ PROJECTS ══════════════════════════════

  /api/v1/projects:
    post:
      tags: [projects]
      summary: Crear proyecto
      operationId: project_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    get:
      tags: [projects]
      summary: Listar proyectos del usuario
      operationId: project_list
      responses:
        "200":
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"

  /api/v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Obtener proyecto por id
      operationId: project_get
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ DISCOVERY ══════════════════════════════

  /api/v1/projects/{project_id}/discovery:
    post:
      tags: [discovery]
      summary: Generar documento de descubrimiento con IA
      operationId: discovery_generate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Documento generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  content:
                    type: string
                required: [project_id, content]
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [discovery]
      summary: Obtener documento de descubrimiento
      operationId: discovery_get
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Documento de descubrimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [discovery]
      summary: Guardar documento de descubrimiento
      operationId: discovery_save
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDiscoveryRequest"
      responses:
        "200":
          description: Documento guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"

  /api/v1/projects/{project_id}/discovery/refine:
    post:
      tags: [discovery]
      summary: Refinar documento de descubrimiento con IA
      operationId: discovery_refine
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineDiscoveryRequest"
      responses:
        "200":
          description: Documento refinado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          description: Instrucciones invalidas (mas de 500 caracteres)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/discovery/chat:
    post:
      tags: [discovery]
      summary: Enviar mensaje al chat de Descubrimiento (aplicacion instantanea)
      description: >-
        Procesa el mensaje y aplica el cambio inmediatamente sobre el documento
        cuando corresponde. Si el cambio pertenece a otra fase (giro de negocio),
        responde con una redireccion hacia esa fase.
      operationId: discovery_chat_send
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Mensaje procesado, modificacion aplicada o redireccion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Error de validacion
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags: [discovery]
      summary: Obtener historial del chat de Descubrimiento
      operationId: discovery_chat_history
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CursorBefore"
      responses:
        "200":
          description: Historial del chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/discovery/chat/undo:
    post:
      x-status: planned
      tags: [discovery]
      summary: Deshacer la ultima modificacion del chat de Descubrimiento
      description: >-
        Restaura la version previa al cambio (undo_version_id devuelto en la
        modificacion). El documento queda como estaba antes del mensaje del chat.
      operationId: discovery_chat_undo
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoChatRequest"
      responses:
        "200":
          description: Documento restaurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/discovery/chat/stream:
    post:
      tags: [discovery]
      summary: Chat de Descubrimiento con streaming SSE
      description: >-
        Genera la respuesta en tiempo real (SSE). Emite eventos token por
        fragmento y, al final, un evento message con la respuesta completa y
        la modificacion aplicada o la redireccion.
      operationId: discovery_chat_stream
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Stream de eventos SSE
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ FEATURES ══════════════════════════════

  /api/v1/projects/{project_id}/features:
    post:
      tags: [features]
      summary: Generar caracteristicas con IA
      operationId: features_generate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Caracteristicas generadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [features]
      summary: Listar caracteristicas del proyecto
      operationId: features_list
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Lista de caracteristicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"

  /api/v1/projects/{project_id}/features/suggest:
    post:
      tags: [features]
      summary: Sugerir nuevas caracteristicas con IA
      operationId: features_suggest
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Sugerencias generadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureSuggestionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/features/manual:
    post:
      tags: [features]
      summary: Crear caracteristica manualmente
      description: >-
        Crea una caracteristica. Si no se indica origin, la IA lo deriva del
        descubrimiento y verifica coherencia; ante inconsistencia devuelve
        is_saved=false con la razon.
      operationId: features_create_manual
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacteristicRequest"
      responses:
        "200":
          description: Resultado de la creacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCharacteristicResult"
        "400":
          description: Datos invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/features/save:
    post:
      tags: [features]
      summary: Guardar caracteristicas seleccionadas
      operationId: features_save_selected
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSelectedFeaturesRequest"
      responses:
        "201":
          description: Caracteristicas guardadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"

  /api/v1/projects/{project_id}/features/{feature_id}:
    delete:
      tags: [features]
      summary: Eliminar caracteristica y sus artefactos
      operationId: features_delete
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      responses:
        "200":
          description: Caracteristica eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  feature_id:
                    type: string
                required: [status, feature_id]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/features/{feature_id}/propagate:
    post:
      tags: [features]
      summary: Propagar cambios de caracteristica (downstream)
      description: >-
        Evalua el impacto de los cambios aplicados en la caracteristica hacia
        las fases a la derecha (Requisitos, Modelo) y devuelve las fases afectadas.
      operationId: features_propagate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropagateFeatureChangesRequest"
      responses:
        "200":
          description: Fases afectadas downstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseNotificationList"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/features/{feature_id}/consistency/check:
    post:
      tags: [features]
      summary: Verificar consistencia antes de guardar
      operationId: features_check_consistency
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckConsistencyRequestView"
      responses:
        "200":
          description: Resultado de verificacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InconsistencyResultView"

  # ══════════════════════════════ FEATURE CHAT ══════════════════════════════

  /api/v1/features/{feature_id}/chat:
    post:
      tags: [features]
      summary: Enviar mensaje al chat de Caracteristicas (aplicacion instantanea)
      description: >-
        Procesa el mensaje y aplica el cambio inmediatamente sobre la caracteristica
        (titulo, descripcion u origen). Si el cambio pertenece a otra fase,
        responde con una redireccion.
      operationId: feature_chat_send
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Mensaje procesado, modificacion aplicada o redireccion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Error de validacion
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/features/{feature_id}/chat/history:
    get:
      tags: [features]
      summary: Obtener historial del chat de Caracteristicas
      operationId: feature_chat_history
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/CursorBefore"
      responses:
        "200":
          description: Historial del chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/chat/undo:
    post:
      x-status: planned
      tags: [features]
      summary: Deshacer la ultima modificacion del chat de Caracteristicas
      description: >-
        Restaura el valor previo (titulo, descripcion u origen) usando el
        undo_version_id devuelto en la modificacion.
      operationId: feature_chat_undo
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoChatRequest"
      responses:
        "200":
          description: Caracteristica restaurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/chat/stream:
    post:
      tags: [features]
      summary: Chat de Caracteristicas con streaming SSE
      description: >-
        Genera la respuesta en tiempo real (SSE). Emite eventos token por
        fragmento y, al final, un evento message con la modificacion aplicada
        o la redireccion.
      operationId: feature_chat_stream
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Stream de eventos SSE
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ REQUIREMENTS ══════════════════════════════

  /api/v1/features/{feature_id}/requirements/generate:
    post:
      tags: [requirements]
      summary: Generar requisitos EARS con IA
      operationId: requirements_generate
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequirementsRequest"
      responses:
        "200":
          description: Requisitos generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateRequirementsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/features/{feature_id}/requirements:
    get:
      tags: [requirements]
      summary: Obtener requisitos de una caracteristica
      operationId: requirements_get
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Documento de requisitos en Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsDocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [requirements]
      summary: Guardar requisitos manualmente
      operationId: requirements_save
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequirementsRequest"
      responses:
        "200":
          description: Requisitos guardados
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: string
                  message:
                    type: string
                    example: ok
                required: [feature_id, message]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/requirements/refine:
    post:
      tags: [requirements]
      summary: Refinar requisitos EARS con IA
      operationId: requirements_refine
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineRequirementsRequest"
      responses:
        "200":
          description: Requisitos refinados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefineRequirementsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/features/{feature_id}/requirements/propagate:
    post:
      tags: [requirements]
      summary: Propagar cambios de requisitos (downstream)
      description: >-
        Evalua el impacto de los cambios aplicados en los requisitos hacia la
        fase a la derecha (Modelo) y devuelve las fases afectadas.
      operationId: requirements_propagate
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropagateRequirementsRequest"
      responses:
        "200":
          description: Fases afectadas downstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseNotificationList"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ REQUIREMENT CHAT ══════════════════════════════

  /api/v1/features/{feature_id}/requirements/chat:
    post:
      tags: [requirements]
      summary: Enviar mensaje al chat de Requisitos (aplicacion instantanea)
      description: >-
        Procesa el mensaje y aplica el cambio inmediatamente sobre el documento
        de requisitos. Si el cambio pertenece a otra fase, responde con una
        redireccion.
      operationId: requirement_chat_send
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Mensaje procesado, modificacion aplicada o redireccion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Error de validacion
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/features/{feature_id}/requirements/chat/history:
    get:
      tags: [requirements]
      summary: Obtener historial del chat de Requisitos
      operationId: requirement_chat_history
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/CursorBefore"
      responses:
        "200":
          description: Historial del chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/requirements/chat/undo:
    post:
      x-status: planned
      tags: [requirements]
      summary: Deshacer la ultima modificacion del chat de Requisitos
      description: >-
        Restaura la version previa al cambio (undo_version_id devuelto en la
        modificacion). El documento de requisitos queda como estaba antes.
      operationId: requirement_chat_undo
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoChatRequest"
      responses:
        "200":
          description: Documento de requisitos restaurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsDocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/requirements/chat/stream:
    post:
      tags: [requirements]
      summary: Chat de Requisitos con streaming SSE
      description: >-
        Genera la respuesta en tiempo real (SSE). Emite eventos token por
        fragmento y, al final, un evento message con la modificacion aplicada
        o la redireccion.
      operationId: requirement_chat_stream
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Stream de eventos SSE
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ MODELO ══════════════════════════════

  /api/v1/features/{feature_id}/diagram/generate:
    post:
      tags: [modelo]
      summary: Generar diagrama de actividad PlantUML
      operationId: diagram_generate
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDiagramRequest"
      responses:
        "200":
          description: Diagrama generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/features/{feature_id}/diagram:
    get:
      tags: [modelo]
      summary: Obtener diagrama de actividad
      operationId: diagram_get
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Diagrama existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/diagram/propagate:
    post:
      tags: [modelo]
      summary: Regenerar diagrama tras cambios upstream
      operationId: diagram_propagate
      parameters:
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDiagramRequest"
      responses:
        "200":
          description: Diagrama regenerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ CONSISTENCY ══════════════════════════════

  /api/v1/projects/{project_id}/consistency/evaluate:
    post:
      tags: [consistency]
      summary: Evaluar consistencia entre fases (solo downstream)
      description: >-
        Evalua el impacto de cambios sobre las fases a la derecha segun el orden
        Descubrimiento -> Caracteristicas -> Requisitos -> Modelo. Si se solicita
        evaluar hacia la izquierda (upstream), devuelve 422.
      operationId: consistency_evaluate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequestView"
      responses:
        "200":
          description: Reporte de consistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyReportView"
        "422":
          description: Direccion de evaluacion no permitida (upstream)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/consistency/evaluate/stream:
    post:
      tags: [consistency]
      summary: Evaluar consistencia con streaming SSE
      description: >-
        Igual que /evaluate pero con progreso en tiempo real (SSE). Aplica la
        misma restriccion downstream-only.
      operationId: consistency_evaluate_stream
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequestView"
      responses:
        "200":
          description: Stream SSE con progreso y reporte final
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConsistencyStreamEvent"
        "422":
          description: Direccion de evaluacion no permitida (upstream)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/consistency/apply:
    post:
      tags: [consistency]
      summary: Aplicar impactos de consistencia
      description: >-
        Aplica las acciones sugeridas sobre requisitos, caracteristicas y
        diagramas (artefactos downstream).
      operationId: consistency_apply
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyImpactsRequestView"
      responses:
        "200":
          description: Resultado de aplicacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyImpactsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ SCHEMAS ══════════════════════════════

  /api/v1/schemas:
    get:
      tags: [schemas]
      summary: Listar nombres de esquemas disponibles
      operationId: schemas_list
      responses:
        "200":
          description: Lista de nombres de esquemas
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /api/v1/schemas/{name}:
    get:
      tags: [schemas]
      summary: Obtener JSON Schema de un DTO
      operationId: schemas_get
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: "Nombre del DTO (ej: RegisterRequest)"
      responses:
        "200":
          description: JSON Schema del DTO
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ IMPLEMENTATION (planned) ══════════════════════════════

  /api/v1/projects/{project_id}/features/{feature_id}/implementation/stream:
    post:
      x-status: planned
      tags: [implementation]
      summary: Generar implementacion de la Feature con OpenCode (SSE)
      description: >-
        Orquesta el flujo completo: preparacion de workspace -> plan (OpenCode
        Plan Agent) -> build (OpenCode Build Agent) -> validacion deterministica
        (tsc, eslint, vitest, build) -> commit y trazabilidad. Emite progreso por SSE.
      operationId: implementation_stream
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      responses:
        "200":
          description: Stream SSE de progreso de generacion
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ImplementationStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Workspace bloqueado (otra implementacion en curso)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/implementation/workspace:
    get:
      x-status: planned
      tags: [implementation]
      summary: Obtener estado del workspace de codigo del proyecto
      operationId: implementation_workspace
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Estado del workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/features/{feature_id}/implementation/status:
    get:
      x-status: planned
      tags: [implementation]
      summary: Obtener estado de implementacion de una Feature
      operationId: implementation_status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      responses:
        "200":
          description: Estado de la implementacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationStatusView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/implementation/validate:
    post:
      x-status: planned
      tags: [implementation]
      summary: Re-ejecutar pipeline de validacion del workspace
      operationId: implementation_validate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Resultado de la validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunResultView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/implementation/traceability:
    get:
      x-status: planned
      tags: [implementation]
      summary: Obtener trazabilidad Feature -> Requisito -> Archivo -> Test
      operationId: implementation_traceability
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Aristas de trazabilidad del proyecto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraceabilityEdgeView"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por /auth/token o /auth/refresh

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del proyecto (prj_ + ULID)
    FeatureId:
      name: feature_id
      in: path
      required: true
      schema:
        type: string
      description: Identificador o slug de la caracteristica
    ProjectIdQuery:
      name: project_id
      in: query
      required: true
      schema:
        type: string
      description: Identificador del proyecto
    CursorBefore:
      name: before
      in: query
      required: false
      schema:
        type: string
      description: Cursor ISO-8601 para paginacion hacia atras

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      type: object
      description: Error RFC 7807 (application/problem+json)
      properties:
        type:
          type: string
          description: URN del error (ej. urn:kosmo:projects:not-found)
          example: urn:kosmo:projects:not-found
        title:
          type: string
          description: Mensaje corto
        status:
          type: integer
          description: Codigo HTTP
        detail:
          type: string
          description: Descripcion larga
        instance:
          type: string
          description: Ruta que fallo
        trace_id:
          type: string
          description: Identificador de correlacion (X-Trace-Id)
        violations:
          type: array
          items:
            type: object
            properties:
              loc:
                type: string
                description: Ruta al campo invalido
              msg:
                type: string
              input:
                description: Valor recibido
      required: [type, title, status, detail]

    # ── Auth ──

    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      required: [email, password]

    AuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge_method:
          type: string
          enum: [S256]
          default: S256
        scopes:
          type: array
          items:
            type: string
          default: []
      required: [email, password, code_challenge]

    TokenExchangeRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
      required: [grant_type, code, code_verifier]

    TokenRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
      required: [grant_type, refresh_token]

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          nullable: true
      required: [refresh_token]

    UserPublic:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [id, email, created_at]

    AuthorizationCodeResponse:
      type: object
      properties:
        authorization_code:
          type: string
        expires_in:
          type: integer
          minimum: 1
          maximum: 600
      required: [authorization_code, expires_in]

    TokenView:
      type: object
      properties:
        token:
          type: string
        jti:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [token, jti, expires_at]

    TokenPairResponse:
      type: object
      properties:
        access:
          $ref: "#/components/schemas/TokenView"
        refresh:
          $ref: "#/components/schemas/TokenView"
        token_type:
          type: string
          enum: [Bearer]
      required: [access, refresh, token_type]

    PrincipalView:
      type: object
      properties:
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
      required: [subject, scopes]

    OAuthErrorResponse:
      type: object
      description: Error compatible con RFC 6749 seccion 5.2
      properties:
        error:
          type: string
          description: Codigo de error (invalid_grant, invalid_token, account_locked, email_already_registered)
        error_description:
          type: string
      required: [error, error_description]

    # ── Projects ──

    CreateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ""
      required: [name]

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        owner_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, slug, description, owner_id, created_at, updated_at]

    # ── Discovery ──

    DiscoveryResponse:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        content:
          type: string
          description: Documento en formato Markdown
      required: [id, project_id, content]

    SaveDiscoveryRequest:
      type: object
      properties:
        content:
          type: string
          description: Documento en formato Markdown
      required: [content]

    RefineDiscoveryRequest:
      type: object
      additionalProperties: false
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 500
      required: [instructions]

    # ── Features ──

    FeatureResponse:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        number:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        origin:
          type: string
        display_id:
          type: string
          example: C01
      required: [id, project_id, number, title, slug, description, origin, display_id]

    FeatureSuggestionResponse:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        description:
          type: string
        origin:
          type: string
      required: [number, title, description, origin]

    SaveSelectedFeaturesRequest:
      type: object
      properties:
        features:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              origin:
                type: string
                default: ""
            required: [title, description]
      required: [features]

    CreateCharacteristicRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 500
          default: ""
        origin:
          type: string
          default: ""
        force:
          type: boolean
          default: false
      required: [title]

    CreateCharacteristicResult:
      type: object
      properties:
        is_saved:
          type: boolean
        feature:
          $ref: "#/components/schemas/FeatureResponse"
          description: Presente solo si is_saved=true
        origin:
          type: string
        is_consistent:
          type: boolean
        inconsistency_reason:
          type: string
          description: Presente solo si is_saved=false por inconsistencia
      required: [is_saved, origin, is_consistent]

    PropagateFeatureChangesRequest:
      type: object
      additionalProperties: false
      properties:
        applied_change_ids:
          type: array
          items:
            type: string
          default: []
      required: [applied_change_ids]

    CheckConsistencyRequestView:
      type: object
      additionalProperties: false
      properties:
        content:
          type: object
          description: Contenido nuevo a validar contra el documento fuente
      required: [content]

    InconsistencyResultView:
      type: object
      properties:
        is_consistent:
          type: boolean
        reason:
          type: string
          nullable: true
        conflicting_section:
          type: string
          nullable: true
      required: [is_consistent]

    # ── Chat (aplicacion instantanea, sin plan) ──

    PhaseNotificationView:
      type: object
      properties:
        phase:
          type: string
          description: Fase afectada
        affected_count:
          type: integer
        affected_ids:
          type: array
          items:
            type: string
      required: [phase, affected_count, affected_ids]

    PhaseNotificationList:
      type: object
      properties:
        affected_phases:
          type: array
          items:
            $ref: "#/components/schemas/PhaseNotificationView"
      required: [affected_phases]

    SendChatRequest:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [content]

    ModificationResult:
      type: object
      description: >-
        Resultado de la modificacion aplicada por el chat. Incluye el diff
        aplicado (before/after) para que el frontend ofrezca aceptar (no hacer
        nada, ya esta aplicado) o deshacer via el endpoint /chat/undo con el
        undo_version_id.
      properties:
        applied:
          type: boolean
        modified_section:
          type: string
          nullable: true
        change_description:
          type: string
          nullable: true
        modified_document:
          type: string
          nullable: true
          description: >-
            Markdown completo modificado. En el chat de Caracteristicas contiene
            el nuevo titulo.
        before:
          type: string
          nullable: true
          description: Contenido previo de la seccion o atributo modificado
        after:
          type: string
          nullable: true
          description: Contenido posterior de la seccion o atributo modificado
        undo_version_id:
          type: string
          nullable: true
          description: >-
            Version previa al cambio. Se envia a POST .../chat/undo para
            deshacer la modificacion. Presente solo si applied=true.
        clarification_message:
          type: string
          nullable: true
          description: Presente cuando applied=false (instruccion ambigua)
      required: [applied]

    UndoChatRequest:
      type: object
      additionalProperties: false
      properties:
        version_id:
          type: string
          description: undo_version_id devuelto por la modificacion a deshacer
      required: [version_id]

    RedirectInfo:
      type: object
      description: Redireccion cuando el cambio pertenece a otra fase
      properties:
        target_phase:
          type: string
          description: Fase destino (descubrimiento, caracteristicas, requisitos, modelo)
        redirect_message:
          type: string
          description: Explicacion de por que el cambio pertenece a esa fase
      required: [target_phase, redirect_message]

    ChatMessageView:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time
        modification:
          $ref: "#/components/schemas/ModificationResult"
          description: Modificacion aplicada (solo mensajes del asistente)
      required: [id, role, content, created_at]

    ChatResponse:
      type: object
      description: >-
        Respuesta del chat. Contiene el mensaje y, alternativamente, la
        modificacion aplicada o la redireccion a otra fase. Cuando se aplica
        una modificacion, incluye los impactos de consistencia detectados en
        las fases a la derecha (trazabilidad descendente).
      properties:
        message:
          $ref: "#/components/schemas/ChatMessageView"
        modification:
          $ref: "#/components/schemas/ModificationResult"
          description: Presente si el chat aplico un cambio
        redirect:
          $ref: "#/components/schemas/RedirectInfo"
          description: Presente si el cambio pertenece a otra fase
        consistency:
          type: array
          nullable: true
          description: >-
            Impactos de consistencia en las fases a la derecha
            (Descubrimiento -> Caracteristicas -> Requisitos -> Modelo).
            Solo presente cuando applied=true.
          items:
            $ref: "#/components/schemas/ImpactItemView"
      required: [message]

    ChatHistoryResponse:
      type: object
      properties:
        phase:
          type: string
        context:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageView"
        has_more:
          type: boolean
          default: false
        next_cursor:
          type: string
          nullable: true
      required: [phase, context, messages]

    ChatStreamEvent:
      oneOf:
        - type: object
          description: Fragmento de texto en tiempo real
          properties:
            type:
              type: string
              const: token
            content:
              type: string
          required: [type, content]
        - type: object
          description: Mensaje final con modificacion aplicada o redireccion
          properties:
            type:
              type: string
              const: message
            content:
              type: string
            modification:
              $ref: "#/components/schemas/ModificationResult"
            redirect:
              $ref: "#/components/schemas/RedirectInfo"
          required: [type, content]

    # ── Requirements ──

    GenerateRequirementsRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
      required: [project_id]

    EARSRequirementView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        statement:
          type: string
        pattern:
          type: string
          description: Patron EARS (ubiquitous, event_driven, state_driven, optional, unwanted, complex)
        acceptance_criteria:
          type: array
          items:
            type: object
      required: [id, title, statement, pattern]

    GenerateRequirementsResponse:
      type: object
      properties:
        project_id:
          type: string
        feature_id:
          type: string
        feature_number:
          type: integer
        document_markdown:
          type: string
        total:
          type: integer
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/EARSRequirementView"
      required: [project_id, feature_id, feature_number, document_markdown, total, requirements]

    RequirementsDocumentResponse:
      type: object
      properties:
        document_markdown:
          type: string
          nullable: true
        total:
          type: integer
      required: [document_markdown, total]

    SaveRequirementsRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        markdown:
          type: string
      required: [project_id, markdown]

    RefineRequirementsRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        instructions:
          type: string
          minLength: 1
          maxLength: 500
      required: [project_id, instructions]

    RefineRequirementsResponse:
      type: object
      properties:
        feature_id:
          type: string
        feature_number:
          type: integer
        document_markdown:
          type: string
        total:
          type: integer
      required: [feature_id, feature_number, document_markdown, total]

    PropagateRequirementsRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        applied_change_ids:
          type: array
          items:
            type: string
          default: []
      required: [project_id, applied_change_ids]

    # ── Modelo ──

    GenerateDiagramRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
      required: [project_id]

    DiagramResponse:
      type: object
      properties:
        id:
          type: string
        feature_id:
          type: string
        diagram_syntax:
          type: string
          description: Codigo PlantUML
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, feature_id, diagram_syntax, created_at, updated_at]

    # ── Consistency ──

    ChangeInputView:
      type: object
      properties:
        section:
          type: string
        diff_before:
          type: string
        diff_after:
          type: string
        description:
          type: string
          default: ""
      required: [section, diff_before, diff_after]

    EvaluateConsistencyRequestView:
      type: object
      additionalProperties: false
      properties:
        phase_origin:
          type: string
          description: Fase de origen (descubrimiento, caracteristicas, requisitos, modelo)
        phase_destination:
          type: string
          nullable: true
          description: >-
            Fase destino a evaluar. Debe estar a la derecha de phase_origin
            (Descubrimiento -> Caracteristicas -> Requisitos -> Modelo).
            Si se omite, se evaluan todas las fases a la derecha.
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeInputView"
      required: [phase_origin, changes]

    ImpactItemView:
      type: object
      properties:
        phase:
          type: string
        artifact_id:
          type: string
        artifact_type:
          type: string
        artifact_label:
          type: string
        section:
          type: string
          default: ""
        rationale:
          type: string
          default: ""
        diff_suggestion:
          type: object
          nullable: true
      required: [phase, artifact_id, artifact_type, artifact_label]

    ConsistencyReportView:
      type: object
      properties:
        id:
          type: string
          description: ID del reporte (cnr_ + ULID)
        phase_origin:
          type: string
        own_changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeInputView"
        downstream_impact:
          type: array
          description: Impacto en fases a la derecha
          items:
            $ref: "#/components/schemas/ImpactItemView"
        created_at:
          type: string
          format: date-time
      required: [id, phase_origin, own_changes, downstream_impact, created_at]

    ConsistencyStreamEvent:
      oneOf:
        - type: object
          description: Progreso de evaluacion
          properties:
            type:
              type: string
              const: progress
            message:
              type: string
          required: [type, message]
        - type: object
          description: Reporte final
          properties:
            type:
              type: string
              const: report
            report:
              $ref: "#/components/schemas/ConsistencyReportView"
          required: [type, report]

    ApplyImpactsRequestView:
      type: object
      additionalProperties: false
      properties:
        impacts:
          type: array
          items:
            type: object
            properties:
              artifact_type:
                type: string
                description: EARSRequirement, Feature, ActivityDiagram, DiscoveryDocument
              target_id:
                type: string
              action:
                type: string
                description: update o delete
              field:
                type: string
                default: description
              before:
                type: string
                default: ""
              after:
                type: string
                default: ""
            required: [artifact_type, target_id]
      required: [impacts]

    ApplyImpactsResponse:
      type: object
      properties:
        applied:
          type: array
          items:
            type: object
            properties:
              target_id:
                type: string
              artifact_type:
                type: string
            required: [target_id, artifact_type]
        failed:
          type: array
          items:
            type: object
            properties:
              target_id:
                type: string
              artifact_type:
                type: string
              reason:
                type: string
            required: [target_id, artifact_type, reason]
      required: [applied, failed]

    # ── Implementation (codegen, planificada) ──

    FeatureImplementationStatus:
      type: string
      enum: [pending, in_progress, implemented, failed, needs_update]
      description: Estado de implementacion de una Feature

    WorkspaceStatus:
      type: string
      enum: [not_created, ready, in_use, validating]
      description: Estado del workspace de codigo del proyecto

    ImplementationStreamEvent:
      oneOf:
        - type: object
          description: Progreso del plan de implementacion
          properties:
            type:
              type: string
              const: plan_progress
            message:
              type: string
          required: [type, message]
        - type: object
          description: Progreso de generacion de codigo
          properties:
            type:
              type: string
              const: build_progress
            message:
              type: string
          required: [type, message]
        - type: object
          description: Resultado de un paso de validacion
          properties:
            type:
              type: string
              const: validation
            step:
              type: string
              description: typecheck, lint, tests, build
            success:
              type: boolean
            errors:
              type: array
              items:
                type: string
          required: [type, step, success]
        - type: object
          description: Fin del flujo de implementacion
          properties:
            type:
              type: string
              const: complete
            status:
              type: string
              enum: [success, failed]
            errors:
              type: array
              items:
                type: string
              default: []
          required: [type, status]

    WorkspaceView:
      type: object
      properties:
        project_id:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        workspace_dir:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required: [project_id, status]

    ImplementationStatusView:
      type: object
      properties:
        feature_id:
          type: string
        status:
          $ref: "#/components/schemas/FeatureImplementationStatus"
        last_validated_at:
          type: string
          format: date-time
          nullable: true
        last_errors:
          type: array
          items:
            type: string
          default: []
      required: [feature_id, status]

    ValidationRunResultView:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
                description: typecheck, lint, tests, build
              success:
                type: boolean
              duration_ms:
                type: integer
              errors:
                type: array
                items:
                  type: string
            required: [step, success, duration_ms]
        all_passed:
          type: boolean
      required: [steps, all_passed]

    TraceabilityEdgeView:
      type: object
      properties:
        source_type:
          type: string
          description: feature, requirement, file, test
        source_id:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        origin:
          type: string
          description: llm, codegen
      required: [source_type, source_id, target_type, target_id]
