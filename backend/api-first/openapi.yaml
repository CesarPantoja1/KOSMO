            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ═══ Plan de Cambios (Sprint 4 - HU14, HU15, HU16) ═══

  /api/v1/projects/{project_id}/plan:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    get:
      tags: [plan]
      summary: Obtener estado del plan de cambios
      description: >-
        Devuelve todos los cambios acumulados en el plan para una fase y
        contexto específicos.
      operationId: get_plan_state
      parameters:
        - name: phase
          in: query
          schema:
            type: string
            enum: [discovery, features, requirements, model]
          description: Fase cuyos cambios se consultan
          example: "discovery"
        - name: context
          in: query
          schema:
            type: string
          description: Contexto específico (feature_id o requirement_id). Opcional para Descubrimiento.
          example: "feat_01HXYAZABCDEFGHIJKLMNOP"
      responses:
        "200":
          description: Estado actual del plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanState"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags: [plan]
      summary: Descartar plan de cambios completo
      description: >-
        Descarta todos los cambios pendientes del plan para una fase y
        contexto. Requiere confirmación del usuario en el frontend.
      operationId: discard_plan
      parameters:
        - name: phase
          in: query
          required: true
          schema:
            type: string
            enum: [discovery, features, requirements, model]
          description: Fase cuyo plan se descarta
        - name: context
          in: query
          schema:
            type: string
          description: Contexto específico (opcional para Descubrimiento)
      responses:
        "200":
          description: Plan descartado exitosamente
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/plan/changes:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [plan]
      summary: Agregar cambio al plan
      description: Agrega una sugerencia de cambio (proveniente del chat u otro origen) al plan de cambios.
      operationId: add_plan_change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanChangeRequest"
      responses:
        "200":
          description: Cambio agregado al plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanState"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/plan/changes/{change_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
      - name: change_id
        in: path
        required: true
        schema:
          type: string
        description: ID del cambio a quitar
        example: "chg_01HXYAZABCDEFGHIJKLMNOP"
    delete:
      tags: [plan]
      summary: Quitar cambio del plan
      description: Remueve un cambio individual del plan sin aplicarlo.
      operationId: remove_plan_change
      responses:
        "200":
          description: Cambio removido del plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanState"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto o cambio no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/plan/collision-check:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [plan]
      summary: Verificar colision de edicion manual con cambios pendientes
      description: >-
        Detecta si una edicion manual del usuario colisiona con cambios pendientes
        en el plan. Compara el contenido actual de una seccion contra el diff.before
        de cada PlanChange activo en esa seccion. Si el fragmento original ya no esta
        presente, marca el cambio como CONFLICT y retorna las colisiones detectadas.
      operationId: check_collision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollisionCheckRequest"
      responses:
        "200":
          description: Resultado de la verificacion de colisiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollisionCheckResult"
        "401":
          description: Token ausente, invalido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/plan/apply:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [plan]
      summary: Aplicar lote de cambios (todas las fases)
      description: >-
        Aplica atómicamente un batch de cambios aceptados sobre los documentos
        y artefactos del proyecto. Soporta las fases Descubrimiento (modifica
        documento Markdown), Características (modifica atributos: título,
        descripción, origen) y Requisitos. Al finalizar, propaga notificaciones
        a fases adyacentes según la fase de origen. Soporta error parcial:
        cambios fallidos se reportan individualmente con sección y motivo.
      operationId: apply_batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyBatchRequest"
      responses:
        "200":
          description: Lote aplicado (posiblemente con errores parciales)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al evaluar consistencia post-aplicación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ═══ Consistencia de proyecto (Sprint 4 - HU17, HU18, HU19) ═══
  # NOTA: El endpoint evaluate soporta cualquier par origen→destino
  #       pasando phase_origin y phase_destination.
  #       - HU17: phase_origin=discovery → evalúa downstream (features, requirements, model)
  #       - HU18: phase_origin=features → bidireccional (discovery upstream, requirements+model downstream)
  #       - HU19: phase_origin=requirements → bidireccional (features+discovery upstream, model downstream)

  /api/v1/projects/{project_id}/consistency/evaluate:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [consistency]
      summary: Evaluar consistencia entre fases (bidireccional)
      description: >-
        Evalúa el impacto de cambios entre cualquier par de fases del proyecto.
        Soporta análisis upstream y downstream según el phase_origin indicado.
        El agente analiza qué artefactos heredan conceptos modificados y genera
        sugerencias de actualización con trazabilidad explícita.

        Implementado. Usa EvaluateProjectConsistencyUseCase.
      operationId: evaluate_consistency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequest"
      responses:
        "200":
          description: Reporte de consistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyReport"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al invocar la IA
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/consistency/evaluate/stream:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [consistency]
      summary: Evaluar consistencia con progreso en cascada (SSE streaming)
      description: >-
        Variante streaming de la evaluación de consistencia. Transmite el
        progreso del análisis por cada fase destino mediante Server-Sent Events.
        Útil para mostrar indicadores de progreso en el frontend cuando hay
        múltiples fases destino a evaluar.

        Implementado. Usa CascadingConsistencyUseCase.
      operationId: evaluate_consistency_stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequest"
      responses:
        "200":
          description: Stream SSE del progreso de evaluación
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  phase:
                    type: string
                    description: Fase que se está evaluando
                  status:
                    type: string
                    enum: [evaluating, completed, failed]
                  report:
                    $ref: "#/components/schemas/ConsistencyReport"
                    description: Reporte parcial (solo en evento completed)
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/consistency/apply:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    post:
      tags: [consistency]
      summary: Aplicar impactos de consistencia
      description: >-
        Aplica las acciones sugeridas por el análisis de consistencia sobre
        requisitos, características y diagramas. Permite aceptar o rechazar
        cambios individuales tras la revisión en el PanelEvaluacionImpacto.

        Implementado. Usa ApplyConsistencyImpactsUseCase.
      operationId: apply_consistency_impacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                impacts:
                  type: array
                  items:
                    type: object
                  description: Lista de impactos a aplicar
      responses:
        "200":
          description: Impactos aplicados (con detalle de éxitos y fallos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: array
                    items:
                      type: object
                      properties:
                        target_id:
                          type: string
                        artifact_type:
                          type: string
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        target_id:
                          type: string
                        artifact_type:
                          type: string
                        reason:
                          type: string
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/consistency/status:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID del proyecto
        example: "prj_01KTABCDEFGHIJKLMNOP"
    get:
      tags: [consistency]
      summary: Obtener estado de consistencia del proyecto
      description: >-
        Devuelve el estado de actualización de cada fase del proyecto,
        indicando cuáles tienen artefactos desactualizados y por qué.
      operationId: get_consistency_status
      parameters:
        - name: phase
          in: query
          schema:
            type: string
            enum: [discovery, features, requirements, model]
          description: Filtrar por fase específica. Si se omite, devuelve todas.
      responses:
        "200":
          description: Estado de consistencia por fase
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ConsistencyStatus"
        "401":
          description: Token ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Proyecto no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

