      summary: Listar nombres de esquemas disponibles
      operationId: list_schemas
      responses:
        "200":
          description: Lista de nombres de DTOs disponibles para introspección
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/schemas/{name}:
    parameters:
      - name: name
        in: path
        required: true
