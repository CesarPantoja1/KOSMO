# KOSMO Staging stack (AWS EC2)
#
# This stack deliberately contains only the application delivery path:
# Next.js, FastAPI, Nginx, and the Cloudflare Tunnel. Observability remains
# exclusive to the existing Production stack on Oracle Cloud.
#
# The deployment workflow supplies KOSMO_WEB_IMAGE, KOSMO_API_IMAGE and
# CLOUDFLARE_TUNNEL_TOKEN at deploy time. Application configuration is read
# from .env, which is created from the protected GitHub Environment secret.

services:
  frontend:
    image: ${KOSMO_WEB_IMAGE:?KOSMO_WEB_IMAGE must be set}
    container_name: kosmo-staging-frontend
    init: true
    env_file:
      - .env
    environment:
      PORT: "3000"
    restart: unless-stopped

  backend:
    image: ${KOSMO_API_IMAGE:?KOSMO_API_IMAGE must be set}
    container_name: kosmo-staging-backend
    init: true
    env_file:
      - .env
    environment:
      PORT: "8000"
      RUN_MIGRATIONS: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if response.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kosmo-staging-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kosmo-staging-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  default:
    name: kosmo-staging-network
