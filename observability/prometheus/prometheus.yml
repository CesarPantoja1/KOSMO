global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kosmo-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kosmo-backend:8000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['kosmo-node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['kosmo-cadvisor:8080']
