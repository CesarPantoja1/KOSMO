# SonarCloud configuration for KOSMO
sonar.projectKey=CesarPantoja1_KOSMO
sonar.organization=cesarpantoja1

# Exclusiones de análisis: plantillas de código generado (artefactos de usuario) y artefactos de build
sonar.exclusions=**/templates/**,**/basic-next-app/**,**/.next/**,**/dist/**,**/build/**,**/node_modules/**

# Rutas declaradas de pruebas
sonar.tests=backend/tests,frontend/src

# Exclusión del cálculo de duplicaciones para tests, mocks y plantillas
sonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/templates/**,**/basic-next-app/**,**/mock/**
